<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MARF Operator Console feature map</title>
  <desc id="desc">A simplified dark operator console with navigation, paper and live states, protocol status, and a safe read-only chat rail.</desc>
  <rect width="1400" height="760" fill="#08090a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f6f7f8">
    <text x="48" y="74" font-size="54" font-weight="700" letter-spacing="-3">MARF</text>
    <text x="48" y="106" font-size="15" fill="#a7adb5" letter-spacing="2">OPERATOR CONSOLE · PUBLIC FEATURE MAP</text>
    <g transform="translate(900 42)">
      <rect width="86" height="38" rx="5" fill="#f6f7f8"/><text x="17" y="25" font-size="15" font-weight="700" fill="#111">PAPER</text>
      <rect x="96" width="86" height="38" rx="5" fill="#111419" stroke="#3c424b"/><text x="121" y="25" font-size="15" font-weight="700">LIVE</text>
      <rect x="192" width="184" height="38" rx="5" fill="#111419" stroke="#3c424b"/><text x="209" y="25" font-size="15" font-weight="700">LIVE · BLOCKED</text>
    </g>
    <g fill="#101216" stroke="#3a3e45">
      <rect x="36" y="146" width="180" height="72" rx="6"/><rect x="36" y="230" width="180" height="72" rx="6"/><rect x="36" y="314" width="180" height="72" rx="6"/><rect x="36" y="398" width="180" height="72" rx="6"/><rect x="36" y="482" width="180" height="72" rx="6"/><rect x="36" y="566" width="180" height="72" rx="6"/>
      <rect x="238" y="146" width="820" height="82" rx="8"/><rect x="238" y="242" width="820" height="100" rx="8"/><rect x="238" y="356" width="820" height="152" rx="8"/><rect x="238" y="522" width="820" height="116" rx="8"/>
      <rect x="1080" y="146" width="284" height="492" rx="8"/>
    </g>
    <g font-size="17" font-weight="700">
      <text x="57" y="190">COMMAND CENTER</text><text x="57" y="274">ORDERS</text><text x="57" y="358">STRATEGIES</text><text x="57" y="442">ROUTERS</text><text x="57" y="526">DATA ACQUISITION</text><text x="57" y="610">SAFETY</text>
    </g>
    <text x="266" y="180" font-size="14" fill="#a7adb5" letter-spacing="2">OPERATOR SCOPE</text><text x="266" y="209" font-size="28" font-weight="700">Command Center</text>
    <g transform="translate(266 262)">
      <g><text font-size="13" fill="#a7adb5">SCHEDULER</text><text y="29" font-size="22" font-weight="700">ENABLED</text><text y="53" font-size="14" fill="#a7adb5">shared paper/live protocol</text></g>
      <g transform="translate(230)"><text font-size="13" fill="#a7adb5">PROTOCOL</text><text y="29" font-size="22" font-weight="700">WAITING</text><text y="53" font-size="14" fill="#a7adb5">market-session gate</text></g>
      <g transform="translate(460)"><text font-size="13" fill="#a7adb5">DATA EVIDENCE</text><text y="29" font-size="22" font-weight="700">READY</text><text y="53" font-size="14" fill="#a7adb5">freshness and coverage</text></g>
    </g>
    <text x="266" y="390" font-size="15" fill="#a7adb5" letter-spacing="2">AUTOMATED TRADING CYCLE</text>
    <g transform="translate(266 412)" font-size="16"><rect width="180" height="72" rx="5" fill="#14171b"/><text x="16" y="27" fill="#a7adb5">DATA PREP</text><text x="16" y="54" font-weight="700">READY</text><rect x="198" width="180" height="72" rx="5" fill="#14171b"/><text x="214" y="27" fill="#a7adb5">TARGETS</text><text x="214" y="54" font-weight="700">VERIFIED</text><rect x="396" width="180" height="72" rx="5" fill="#14171b"/><text x="412" y="27" fill="#a7adb5">EXECUTION</text><text x="412" y="54" font-weight="700">GATED</text><rect x="594" width="180" height="72" rx="5" fill="#14171b"/><text x="610" y="27" fill="#a7adb5">CAPTURE</text><text x="610" y="54" font-weight="700">SCHEDULED</text></g>
    <text x="266" y="555" font-size="15" fill="#a7adb5" letter-spacing="2">EVIDENCE BEFORE ACTION</text><text x="266" y="588" font-size="25" font-weight="700">Paper execution, reconciliation, and safety gates remain visible.</text>
    <text x="1106" y="180" font-size="15" fill="#a7adb5" letter-spacing="2">MARF BOT</text><text x="1106" y="213" font-size="20" font-weight="700">Ask about state, strategy,</text><text x="1106" y="239" font-size="20" font-weight="700">data, or risk.</text>
    <rect x="1106" y="280" width="232" height="206" rx="6" fill="#0b0d10" stroke="#2e333a"/><text x="1124" y="314" font-size="14" fill="#cdd3da">“Why is execution gated?”</text><text x="1124" y="356" font-size="14" fill="#a7adb5">Protocol requires a valid</text><text x="1124" y="378" font-size="14" fill="#a7adb5">session and fresh evidence.</text><rect x="1106" y="520" width="232" height="52" rx="6" fill="#0b0d10" stroke="#2e333a"/><text x="1124" y="552" font-size="14" fill="#a7adb5">Safe actions · No broker writes</text>
  </g>
</svg>
